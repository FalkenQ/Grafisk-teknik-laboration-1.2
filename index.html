<!DOCTYPE html>
<html lang="sv">

    <head>
        <meta
            name="Startsidan"
            content="En översikt över min portfolio">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hem | Min portfölj</title>

        <!-- CSS -->
        <link rel="stylesheet" href="style.css">
    
        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    </head>

    <body>
        <header>
            <a href="index.html">
                <img src="images/logo.svg" id="logo" alt="Min logotyp">
            </a>

            <nav class="navbar">
                <ul>
                    <li><a href="index.html">Hem</a></li>
                    <li><a href="pictures.html">Bilder</a></li>
                    <li><a href="about.html">Om mig</a></li>
                </ul>
            </nav>

        </header>

        <main>
            <picture class="hero-picture">
                <source
                type="image/avif"
                srcset="images2/hero-1320.avif 1320w,
                        images2/hero-1920.avif 1920w"
                sizes="100vw">

                <img
                src="images2/hero-1320.png"
                srcset="images2/hero-1320.png 1320w,
                        images2/hero-1920.png 1920w"
                sizes="100vw"
                width="1920"
                height="864"
                fetchpriority="high"
                alt="Bergslandskap i Schweiz">
            </picture>

            <h1>Min Portfölj</h1>

            <section class="pictures">
                <picture class="portfolio-picture">
                    <source
                    type="image/avif"
                    srcset="images2/bilserie001.avif">

                    <img
                    src="images2/bilserie001.jpg"
                    width="900"
                    height="807"
                    alt="En person som dyker">
                </picture>

                <picture class="portfolio-picture">
                    <source
                    type="image/avif"
                    srcset="images2/bilserie003.avif">

                    <img
                    src="images2/bilserie003.jpg"
                    width="900"
                    height="807"
                    alt="En ko på en äng">
                </picture>

                <picture class="portfolio-picture">
                    <source
                    type="image/avif"
                    srcset="images2/bilserie005.avif">

                    <img
                    src="images2/bilserie005.jpg"
                    width="900"
                    height="807"
                    alt="En blomma på sidan av ett berg">
                </picture>

                <p class="about-assignment">
                    I denna uppgift ska jag skapa en hemsida med tre olika sidor, för att visa att jag kan bildbehandla bilder och
                    implementera dem på en hemsida. Jag kommer att använda mig av photopea och pixlr för att redigera bilderna.
                </p>
            </section>

        </main>
    </body>
</html>
